name: Tauri test build

# feat/tauri: build and check on all three systems.
# release/tauri: the same, plus a prerelease tagged tauri-v<version> for testers.
# Prereleases never reach Electron users: their updaters and the website read releases/latest,
# which skips prereleases, and release.yml only runs on v* tags.

on:
  workflow_dispatch:
  push:
    branches: [feat/tauri, release/tauri]
    paths: ['spike/**', '.github/workflows/tauri-test.yml']

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            bundles: app,dmg
          - os: windows-latest
            bundles: nsis
          - os: ubuntu-24.04
            bundles: deb,appimage
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'pnpm'
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: spike/pydb/requirements.txt
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: spike/tauri/src-tauri

      - name: Linux packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev librsvg2-dev patchelf xvfb libfuse2t64 \
            gstreamer1.0-plugins-base gstreamer1.0-plugins-good gstreamer1.0-plugins-bad gstreamer1.0-libav

      - run: pnpm install --frozen-lockfile
      - run: pnpm build:vite
      - run: python spike/tauri/prepare.py

      - name: Python sidecar
        run: |
          python -m pip install -q -r spike/pydb/requirements.txt
          cd spike/pydb
          pyinstaller -y --onedir --name rbdb --log-level ERROR --distpath build/dist --workpath build/work --specpath build sidecar.py

      - name: Node sidecar
        run: |
          TRIPLE=$(rustc -vV | sed -n 's/host: //p')
          EXT=""; [ "$RUNNER_OS" = Windows ] && EXT=".exe"
          mkdir -p spike/node/build spike/tauri/src-tauri/binaries
          ./node_modules/.bin/esbuild spike/node/entry.ts --bundle --platform=node --format=cjs --target=node22 --outfile=spike/node/build/backend.cjs --log-level=warning
          cd spike/node/build
          echo '{"main":"backend.cjs","output":"sea.blob","disableExperimentalSEAWarning":true}' > sea.json
          node --experimental-sea-config sea.json
          OUT=../../tauri/src-tauri/binaries/backend-$TRIPLE$EXT
          cp "$(node -p process.execPath)" "$OUT"
          if [ "$RUNNER_OS" = macOS ]; then
            codesign --remove-signature "$OUT"
            npx --yes postject@1.0.0-alpha.6 "$OUT" NODE_SEA_BLOB sea.blob --sentinel-fuse NODE_SEA_FUSE_fce680ab2cc467b6e072b8b5df1996b2 --macho-segment-name NODE_SEA
            codesign -s - "$OUT"
          else
            npx --yes postject@1.0.0-alpha.6 "$OUT" NODE_SEA_BLOB sea.blob --sentinel-fuse NODE_SEA_FUSE_fce680ab2cc467b6e072b8b5df1996b2
          fi

      - name: Tauri build
        working-directory: spike/tauri
        env:
          # Only the release branch bundles the key; it is never written to the repo.
          REKORDBOX_DB_KEY: ${{ github.ref == 'refs/heads/release/tauri' && secrets.REKORDBOX_DB_KEY || '' }}
        run: npx --yes @tauri-apps/cli@2.12.6 build --bundles ${{ matrix.bundles }}

      - name: Run checks
        run: |
          python spike/gen_audio.py "$RUNNER_TEMP/audio"
          export SPIKE_MP3="$RUNNER_TEMP/audio/tone.wav" SPIKE_AIF="$RUNNER_TEMP/audio/tone.aiff" SPIKE_UI=1
          REL=spike/tauri/src-tauri/target/release
          case "$RUNNER_OS" in
            macOS) EXE="$(ls -d $REL/bundle/macos/*.app)/Contents/MacOS/rblf-spike"; RUN="" ;;
            Windows) EXE="$REL/rblf-spike.exe"; RUN="" ;;
            Linux) EXE="$REL/rblf-spike"; RUN="xvfb-run -a" ;;
          esac
          $RUN "$EXE" > run.log 2>&1 &
          sleep 40
          kill $! 2>/dev/null || true
          [ "$RUNNER_OS" = Windows ] && taskkill //F //IM rblf-spike.exe >/dev/null 2>&1 || true
          {
            echo "### ${{ matrix.os }}"
            echo '```'
            grep -E "SPIKE|panick|rror" run.log | cut -c1-400 || echo "no output"
            echo "--- sizes"
            du -sh spike/pydb/build/dist/rbdb spike/tauri/src-tauri/binaries/*
            find $REL/bundle -type f \( -name '*.dmg' -o -name '*.exe' -o -name '*.deb' -o -name '*.AppImage' \) -exec du -h {} \;
            echo '```'
          } >> $GITHUB_STEP_SUMMARY
          cat run.log
          grep -q "SPIKE DONE" run.log

      - name: Collect installers
        if: github.ref == 'refs/heads/release/tauri'
        run: |
          mkdir -p out
          find spike/tauri/src-tauri/target/release/bundle -type f \( -name '*.dmg' -o -name '*-setup.exe' -o -name '*.deb' -o -name '*.AppImage' \) \
            -exec sh -c 'cp "$1" "out/$(basename "$1" | tr " " "-")"' _ {} \;
          ls -la out

      - uses: actions/upload-artifact@v7
        if: github.ref == 'refs/heads/release/tauri'
        with:
          name: installers-${{ matrix.os }}
          path: out/*

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: log-${{ matrix.os }}
          path: run.log
          if-no-files-found: ignore

  publish:
    needs: build
    if: github.ref == 'refs/heads/release/tauri'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: installers-*
          path: out
          merge-multiple: true
      - name: Prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(python3 -c "import json;print(json.load(open('spike/tauri/src-tauri/tauri.conf.json'))['version'])")
          TAG="tauri-v$VERSION"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" out/* --clobber
          else
            gh release create "$TAG" out/* --prerelease --latest=false --target "$GITHUB_SHA" \
              --title "Tauri test build $VERSION" --notes-file spike/tauri/RELEASE_NOTES.md
          fi
