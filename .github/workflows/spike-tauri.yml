name: Tauri spike

on:
  workflow_dispatch:
  push:
    branches: [feat/tauri]
    paths: ['spike/**', '.github/workflows/spike-tauri.yml']

jobs:
  spike:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
          - os: windows-latest
          - os: ubuntu-24.04
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@stable

      - name: Linux packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev librsvg2-dev patchelf xvfb \
            gstreamer1.0-plugins-base gstreamer1.0-plugins-good gstreamer1.0-plugins-bad gstreamer1.0-libav

      - run: pnpm install --frozen-lockfile
      - run: pnpm build:vite
      - run: python spike/tauri/prepare.py

      - name: Python sidecar
        run: |
          python -m pip install -q pyrekordbox pyinstaller
          cd spike/pydb
          pyinstaller -y --onedir --name rbdb --log-level ERROR --distpath build/dist --workpath build/work --specpath build sidecar.py

      - name: Node sidecar
        run: |
          TRIPLE=$(rustc -vV | sed -n 's/host: //p')
          EXT=""; [ "$RUNNER_OS" = Windows ] && EXT=".exe"
          mkdir -p spike/node/build spike/tauri/src-tauri/binaries
          ./node_modules/.bin/esbuild spike/node/entry.ts --bundle --platform=node --format=cjs --target=node22 --outfile=spike/node/build/backend.cjs --log-level=warning
          cd spike/node/build
          echo '{"main":"backend.cjs","output":"sea.blob","disableExperimentalSEAWarning":true}' > sea.json
          node --experimental-sea-config sea.json
          OUT=../../tauri/src-tauri/binaries/backend-$TRIPLE$EXT
          cp "$(node -p process.execPath)" "$OUT"
          if [ "$RUNNER_OS" = macOS ]; then
            codesign --remove-signature "$OUT"
            npx --yes postject@1.0.0-alpha.6 "$OUT" NODE_SEA_BLOB sea.blob --sentinel-fuse NODE_SEA_FUSE_fce680ab2cc467b6e072b8b5df1996b2 --macho-segment-name NODE_SEA
            codesign -s - "$OUT"
          else
            npx --yes postject@1.0.0-alpha.6 "$OUT" NODE_SEA_BLOB sea.blob --sentinel-fuse NODE_SEA_FUSE_fce680ab2cc467b6e072b8b5df1996b2
          fi

      - name: Tauri build
        working-directory: spike/tauri
        run: |
          case "$RUNNER_OS" in
            macOS) B=app ;; Windows) B=nsis ;; Linux) B=deb ;;
          esac
          npx --yes @tauri-apps/cli@2.9.4 build --bundles $B

      - name: Run checks
        run: |
          python spike/gen_audio.py "$RUNNER_TEMP/audio"
          export SPIKE_MP3="$RUNNER_TEMP/audio/tone.wav" SPIKE_AIF="$RUNNER_TEMP/audio/tone.aiff" SPIKE_UI=1
          REL=spike/tauri/src-tauri/target/release
          case "$RUNNER_OS" in
            macOS) EXE="$REL/bundle/macos/RBLF Spike.app/Contents/MacOS/rblf-spike"; RUN="" ;;
            Windows) EXE="$REL/rblf-spike.exe"; RUN="" ;;
            Linux) EXE="$REL/rblf-spike"; RUN="xvfb-run -a" ;;
          esac
          $RUN "$EXE" > run.log 2>&1 &
          sleep 40
          kill $! 2>/dev/null || true
          [ "$RUNNER_OS" = Windows ] && taskkill //F //IM rblf-spike.exe >/dev/null 2>&1 || true
          echo "### ${{ matrix.os }}" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          grep -E "SPIKE|panick|rror" run.log | cut -c1-300 >> $GITHUB_STEP_SUMMARY || echo "no output" >> $GITHUB_STEP_SUMMARY
          echo "--- sizes" >> $GITHUB_STEP_SUMMARY
          du -sh spike/pydb/build/dist/rbdb spike/tauri/src-tauri/binaries/* >> $GITHUB_STEP_SUMMARY
          find $REL/bundle -maxdepth 2 -type f \( -name '*.deb' -o -name '*.exe' \) -exec du -h {} \; >> $GITHUB_STEP_SUMMARY || true
          [ "$RUNNER_OS" = macOS ] && (cd $REL/bundle/macos && ditto -c -k --keepParent "RBLF Spike.app" /tmp/s.zip && du -h /tmp/s.zip >> $GITHUB_STEP_SUMMARY) || true
          echo '```' >> $GITHUB_STEP_SUMMARY
          cat run.log

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: spike-${{ matrix.os }}
          path: |
            run.log
            spike/tauri/src-tauri/target/release/bundle/nsis/*.exe
            spike/tauri/src-tauri/target/release/bundle/deb/*.deb
          if-no-files-found: ignore
